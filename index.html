<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<title>روان · صديقتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff3f6;
  --bg2:#f1e8ff;
  --bg3:#e6f7ff;
  --ink:#341230;
  --ink2:#7c5a7a;
  --rose:#e24b7a;
  --coral:#ff7a9c;
  --plum:#b0619a;
  --lav:#9b7bd8;
  --gold:#e0a83c;
  --card:rgba(255,255,255,.66);
  --card-line:rgba(255,255,255,.9);
  --shadow:0 18px 50px rgba(120,40,90,.16);
}
*{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
}
html,body{
  width:100%;height:100%;height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  font-family:'Outfit',system-ui,sans-serif;
  color:var(--ink);
  cursor:none;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:0;
  background:
    radial-gradient(45% 45% at 20% 25%, #ffd9e4 0%, transparent 70%),
    radial-gradient(50% 50% at 80% 20%, #e2dbff 0%, transparent 72%),
    radial-gradient(55% 55% at 70% 85%, #d8f4ff 0%, transparent 72%),
    radial-gradient(45% 45% at 25% 85%, #ffe9d6 0%, transparent 70%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-size:200% 200%;
  animation:bgShift 26s ease-in-out infinite alternate;
  filter:saturate(1.05);
}
@keyframes bgShift{
  0%{background-position:0% 0%}
  100%{background-position:100% 100%}
}
.blobs{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.blob{
  position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;
  mix-blend-mode:multiply;
}
.blob.a{width:42vmin;height:42vmin;left:8%;top:14%;background:#ffb3c9;animation:drift1 22s ease-in-out infinite}
.blob.b{width:50vmin;height:50vmin;right:5%;top:8%;background:#c9bbff;animation:drift2 26s ease-in-out infinite}
.blob.c{width:46vmin;height:46vmin;left:12%;bottom:6%;background:#a8e6ff;animation:drift3 24s ease-in-out infinite}
.blob.d{width:38vmin;height:38vmin;right:10%;bottom:8%;background:#ffd9b3;animation:drift2 20s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(12vmin,8vmin)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-10vmin,10vmin)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(8vmin,-10vmin)}}


.grain{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(90,40,80,.05) .5px, transparent .5px);
  background-size:3px 3px;
}


#cursor{
  position:fixed;z-index:9000;pointer-events:none;
  transform:translate(-50%,-50%);font-size:18px;
  filter:drop-shadow(0 2px 6px rgba(180,60,110,.5));
  transition:transform .15s ease;
}
#cursor.clicking{transform:translate(-50%,-50%) scale(1.5) rotate(12deg)}


.wordheart{
  position:absolute;left:50%;top:50%;width:0;height:0;z-index:5;
  transform:translateY(-3vmin);
}


.pill{
  position:absolute;left:0;top:0;z-index:6;
  transform:translate(-50%,-50%) translate(var(--x),var(--y));
  opacity:0;
  transition:opacity .7s ease;
}
.pill.show{opacity:1}
.pbox{
  animation:pfloat 7s ease-in-out infinite;
  animation-delay:var(--pd,0s);
  display:inline-flex;align-items:center;gap:.4em;
  padding:.42em .8em;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--card-line);
  box-shadow:0 6px 18px rgba(120,40,90,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  white-space:nowrap;
  font-size:clamp(.58rem,1.65vmin,1.02rem);
  font-weight:500;color:var(--ink);
  transition:transform .3s ease, background .3s ease, color .3s ease, box-shadow .3s ease;
  will-change:transform;
}
@keyframes pfloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.pill .fk{font-size:1.15em;line-height:1}
.pill .tx{unicode-bidi:plaintext}
.pill.active .pbox,.pill:hover .pbox{
  background:linear-gradient(135deg,var(--coral),var(--plum));
  color:#fff;
  transform:translateY(-2px) scale(1.12);
  box-shadow:0 14px 34px rgba(190,60,130,.4);
}
.pill.active,.pill:hover{z-index:20}


.core{
  position:absolute;left:0;top:0;z-index:8;
  width:38vmin;height:38vmin;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  animation:coreBeat 1.6s ease-in-out infinite;
}
@keyframes coreBeat{
  0%{transform:translate(-50%,-50%) scale(1)}
  11%{transform:translate(-50%,-50%) scale(1.06)}
  22%{transform:translate(-50%,-50%) scale(1)}
  33%{transform:translate(-50%,-50%) scale(1.035)}
  48%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
.core svg{
  position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 24px 50px rgba(200,70,130,.4));
}
.core .cbody{
  position:relative;z-index:2;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  padding:6%;pointer-events:none;
  transform:translateY(-4%);
}
.core .cname{
  font-family:'Aref Ruqaa',serif;font-weight:700;
  font-size:8.4vmin;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#ffe4ee 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 20px rgba(120,20,70,.55);
  filter:drop-shadow(0 2px 10px rgba(120,20,70,.4));
  letter-spacing:1px;
}
.core .csub{
  font-family:'Reem Kufi',sans-serif;font-weight:600;
  font-size:2.1vmin;color:#fff;opacity:.95;
  margin-top:.5em;text-shadow:0 2px 8px rgba(120,20,70,.5);
  letter-spacing:.5px;
}
.core .cgreet{
  font-family:'Fraunces',serif;font-weight:600;font-style:italic;
  font-size:2.3vmin;color:#fff;margin-top:.9em;min-height:1.4em;
  text-shadow:0 2px 10px rgba(120,20,70,.6);
  unicode-bidi:plaintext;
  transition:opacity .35s ease, transform .35s ease;
}
.core .cgreet.swap{opacity:0;transform:translateY(10px)}


.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;
  padding:2.2vh 16px;
  pointer-events:none;
}
.dock{display:flex;gap:10px;pointer-events:auto;animation:fadeDown 1.4s ease .7s both}
.dock button{
  font-family:'Reem Kufi',sans-serif;font-weight:600;
  font-size:clamp(.72rem,1.55vmin,.95rem);
  color:var(--ink);background:var(--card);border:1px solid var(--card-line);
  border-radius:999px;padding:.5em 1.1em;cursor:pointer;
  box-shadow:0 8px 22px rgba(120,40,90,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .2s, background .25s, color .25s;
}
.dock button:hover{transform:translateY(-2px) scale(1.05);background:linear-gradient(135deg,var(--coral),var(--plum));color:#fff}


.modal{
  position:fixed;inset:0;z-index:300;display:none;place-items:center;padding:16px;
  background:rgba(255,240,246,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.modal.open{display:grid}
.sheet{
  width:min(560px,94vw);max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.8));
  border:1px solid var(--card-line);border-radius:26px;
  box-shadow:var(--shadow);padding:16px 16px 20px;
  animation:sheetIn .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.mtabs{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mtab{
  font-family:'Reem Kufi',sans-serif;font-weight:600;font-size:.82rem;
  color:var(--ink2);background:transparent;border:1px solid rgba(120,60,100,.18);
  border-radius:999px;padding:.5em 1em;cursor:pointer;transition:.2s;
}
.mtab.active{color:#fff;background:linear-gradient(135deg,var(--coral),var(--plum));border-color:transparent}
.mclose{
  margin-inline-start:auto;background:rgba(120,60,100,.1);border:none;
  width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;
  color:var(--ink);transition:.25s;
}
.mclose:hover{background:var(--rose);color:#fff;transform:rotate(90deg)}
.mpane{display:block}
.mpane.hidden{display:none}


.gameTop{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;font-family:'Reem Kufi',sans-serif;font-weight:600;color:var(--ink);
}
.chip{
  background:var(--card);border:1px solid var(--card-line);border-radius:999px;
  padding:.4em .9em;font-size:.82rem;box-shadow:0 4px 14px rgba(120,40,90,.1);
}
.gamePlay{
  position:relative;height:min(46vh,320px);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,231,240,.55));
  border:1px solid rgba(255,255,255,.85);
  box-shadow:inset 0 4px 20px rgba(120,40,90,.08);
}
.gheart{
  position:absolute;top:-42px;font-size:30px;cursor:pointer;
  animation:gfall linear forwards;will-change:transform;
  filter:drop-shadow(0 6px 10px rgba(200,70,130,.3));
}
@keyframes gfall{from{transform:translateY(0)}to{transform:translateY(var(--fall))}}
.gheart.pop{animation:gpop .3s ease forwards}
@keyframes gpop{to{transform:scale(1.9) rotate(25deg);opacity:0}}
.gameMsg{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:20px;background:rgba(255,255,255,.6);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font-family:'Reem Kufi',sans-serif;color:var(--ink);
}
.gameMsg h3{font-size:1.15rem;margin-bottom:8px}
.gameMsg p{font-size:.9rem;color:var(--ink2);margin-bottom:15px;font-family:'Outfit',sans-serif}
.gbtn{
  font-family:'Reem Kufi',sans-serif;font-weight:600;font-size:.92rem;color:#fff;
  border:none;border-radius:999px;padding:.7em 1.7em;cursor:pointer;
  background:linear-gradient(135deg,var(--coral),var(--rose) 60%,var(--plum));
  box-shadow:0 10px 24px rgba(200,70,130,.4);transition:.2s;
}
.gbtn:hover{transform:translateY(-2px) scale(1.04)}


.qNum{font-size:.78rem;color:var(--ink2);margin-bottom:6px;font-family:'Outfit',sans-serif}
.qText{
  font-family:'Reem Kufi',sans-serif;font-weight:600;font-size:1.1rem;
  line-height:1.5;margin-bottom:14px;color:var(--ink);
}
.qOpts{display:grid;gap:9px}
.qOpt{
  font-family:'Outfit',sans-serif;text-align:right;font-size:.95rem;color:var(--ink);
  background:var(--card);border:1px solid var(--card-line);border-radius:16px;
  padding:.85em 1.1em;cursor:pointer;transition:.2s;box-shadow:0 6px 16px rgba(120,40,90,.08);
}
.qOpt:hover{transform:translateY(-2px);border-color:var(--coral);background:#fff}
.qReact{
  margin-top:14px;font-family:'Fraunces',serif;font-style:italic;font-size:1rem;
  color:var(--plum);min-height:1.4em;text-align:center;
}
.qEnd{text-align:center;padding:14px 6px}
.qEnd .big{font-size:2.6rem;display:block;margin-bottom:8px}
.qEnd h3{font-family:'Reem Kufi',sans-serif;font-size:1.2rem;margin-bottom:8px}
.qEnd p{font-family:'Outfit',sans-serif;color:var(--ink2);font-size:.92rem;margin-bottom:16px}
.eyebrow{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(.8rem,1.6vw,1.15rem);
  color:var(--ink);
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:999px;
  padding:.45em 1.2em;
  box-shadow:0 8px 24px rgba(120,40,90,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:.5em;
  animation:fadeDown 1.4s ease .4s both;
}
.eyebrow b{
  font-family:'Reem Kufi',sans-serif;font-weight:700;
  background:linear-gradient(120deg,var(--rose),var(--plum));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}


.player{
  position:fixed;z-index:100;
  bottom:calc(2.4vh + env(safe-area-inset-bottom,0px));
  left:3vw;width:min(340px,90vw);
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:22px;
  padding:13px 15px 15px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  animation:playerIn 1.4s cubic-bezier(.16,1,.3,1) 1s both;
}
@keyframes playerIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.player .head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:11px;padding-bottom:9px;
  border-bottom:1px solid rgba(120,60,100,.12);
}
.player .lbl{
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;
  font-size:.82rem;color:var(--plum);display:flex;align-items:center;gap:6px;
}
.wave{display:flex;align-items:flex-end;gap:2.5px;height:14px}
.wave span{width:2.5px;border-radius:2px;background:var(--rose);animation:waveB 1s ease-in-out infinite}
.wave span:nth-child(1){height:6px;animation-delay:0s}
.wave span:nth-child(2){height:12px;animation-delay:.2s}
.wave span:nth-child(3){height:8px;animation-delay:.4s}
.wave span:nth-child(4){height:13px;animation-delay:.6s}
@keyframes waveB{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.wave.paused span{animation-play-state:paused;opacity:.4}
.player .top{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.cover{
  position:relative;flex:0 0 auto;width:50px;height:50px;border-radius:15px;
  display:grid;place-items:center;font-size:23px;
  background:linear-gradient(145deg,#ff9ab6,#e24b7a 70%,#b0619a);
  box-shadow:0 10px 24px rgba(200,70,130,.4);
}
.cover.spin{animation:coverSpin 6s linear infinite}
@keyframes coverSpin{to{transform:rotate(360deg)}}
.tinfo{flex:1;min-width:0}
.ttitle{
  font-family:'Reem Kufi',sans-serif;font-weight:600;font-size:1rem;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tartist{
  font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:500;
  color:var(--ink2);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px;
}
.prog{height:6px;border-radius:999px;background:rgba(120,60,100,.14);cursor:pointer;margin-bottom:4px;overflow:hidden}
.prog .bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--rose),var(--lav))}
.times{
  display:flex;justify-content:space-between;
  font-size:.68rem;font-weight:500;color:var(--ink2);margin-bottom:9px;
}
.ctrls{display:flex;align-items:center;justify-content:center;gap:16px}
.btn{
  background:none;border:none;color:var(--ink2);cursor:pointer;
  display:grid;place-items:center;border-radius:50%;padding:6px;
  transition:transform .2s,color .2s;
}
.btn:hover{color:var(--rose);transform:scale(1.15)}
.btn svg{width:22px;height:22px;fill:currentColor}
.play{
  width:50px;height:50px;color:#fff;
  background:linear-gradient(145deg,var(--coral),var(--rose) 70%,var(--plum));
  box-shadow:0 12px 26px rgba(200,70,130,.45);
}
.play:hover{color:#fff;transform:scale(1.08)}
.play svg{width:24px;height:24px}
.vol{display:flex;align-items:center;gap:8px;margin-top:11px}
.vol svg{width:16px;height:16px;fill:var(--ink2);opacity:.8}
.vol input{
  -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:999px;
  background:rgba(120,60,100,.16);cursor:pointer;
}
.vol input::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--rose);box-shadow:0 2px 8px rgba(200,70,130,.5);
}
.vol input::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--rose)}
#ytPlayer{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:0}


.fp{position:fixed;z-index:3;pointer-events:none;animation:fpUp linear forwards;will-change:transform,opacity}
@keyframes fpUp{
  0%{transform:translateY(105vh) scale(0) rotate(0);opacity:0}
  10%{opacity:.9;transform:translateY(92vh) scale(1) rotate(20deg)}
  88%{opacity:.5}
  100%{transform:translateY(-8vh) scale(.3) rotate(340deg);opacity:0}
}
.spk{position:fixed;z-index:8000;pointer-events:none;animation:spkOut .9s ease-out forwards;will-change:transform,opacity}
@keyframes spkOut{
  0%{transform:scale(0) rotate(0);opacity:1}
  60%{transform:scale(1.4) rotate(160deg);opacity:.85}
  100%{transform:scale(0) rotate(320deg);opacity:0}
}
.cf{position:fixed;z-index:8500;pointer-events:none;animation:cfFall 2.8s ease-out forwards;will-change:transform,opacity}
@keyframes cfFall{
  0%{transform:translateY(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateY(100vh) rotate(620deg) scale(.2);opacity:0}
}


.overlay{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:rgba(255,240,246,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  cursor:none;transition:opacity .6s ease;
}
.overlay.hide{opacity:0;pointer-events:none}
.overlay .inner{
  text-align:center;padding:0 24px;
  animation:ovPulse 2s ease-in-out infinite;
}
@keyframes ovPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.overlay .big{
  font-size:3.6rem;display:block;margin-bottom:8px;
  filter:drop-shadow(0 8px 22px rgba(200,70,130,.4));
}
.overlay .t1{
  font-family:'Aref Ruqaa',serif;font-weight:700;
  font-size:clamp(1.7rem,7vw,2.6rem);
  background:linear-gradient(120deg,var(--rose),var(--plum));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.overlay .t2{
  font-family:'Fraunces',serif;font-style:italic;
  font-size:clamp(.9rem,2.6vw,1.1rem);color:var(--ink2);margin-top:10px;
}
.overlay .hint{
  margin-top:22px;
  display:inline-flex;align-items:center;gap:.5em;
  background:var(--card);border:1px solid var(--card-line);
  border-radius:999px;padding:.6em 1.3em;
  box-shadow:var(--shadow);
  font-weight:600;color:var(--ink);
}


@media (max-width:560px){
  .player{
    left:50%;transform:translateX(-50%);
    width:min(420px,93vw);
    bottom:calc(1.6vh + env(safe-area-inset-bottom,0px));
    padding:11px 13px 13px;border-radius:20px;
  }
  @keyframes playerIn{from{opacity:0;transform:translateX(-50%) translateY(40px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  .cover{width:44px;height:44px;font-size:20px;border-radius:13px}
  .ttitle{font-size:.94rem}
  .play{width:46px;height:46px}
  .play svg{width:22px;height:22px}
  .btn svg{width:20px;height:20px}
  .wordheart{transform:translateY(-6vmin)}
  .core{width:42vmin;height:42vmin}
  .core .cname{font-size:9.8vmin}
  .topbar{padding-top:1.8vh}
  .sheet{padding:13px 12px 16px;border-radius:22px}
  .gamePlay{height:min(42vh,260px)}
  .gheart{font-size:27px}
}
@media (max-height:540px) and (orientation:landscape){
  .player{width:min(300px,40vw)}
  .wordheart{transform:translateY(0) scale(.9)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.15s !important}
}
</style>
</head>
<body>


<div class="blobs">
  <span class="blob a"></span>
  <span class="blob b"></span>
  <span class="blob c"></span>

const SCALE = 2.55;


function heartCurve(count, scale, offset){
  const SEG = 3000;
  const pts = [];
  for (let i = 0; i <= SEG; i++){
    const t = (i / SEG) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const p = { x: x * scale, y: y * scale };
    p.d = i === 0 ? 0 : pts[i - 1].d + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y);
    pts.push(p);
  }
  const total = pts[pts.length - 1].d;
  const out = [];
  for (let k = 0; k < count; k++){
    const target = total * ((k + offset) / count);
    let lo = 0, hi = pts.length - 1;
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      if (pts[mid].d < target) lo = mid + 1; else hi = mid;
    }
    out.push(pts[lo]);
  }
  return out;
}

function fmt(t){
  if (!t || isNaN(t)) return "0:00";
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + (s < 10 ? "0" + s : s);
}
function setPlaying(p){
  el.playIcon.innerHTML = `<path d="${p ? ICON_PAUSE : ICON_PLAY}"/>`;
  el.cover.classList.toggle("spin", p);
  el.wave.classList.toggle("paused", !p);
}
function loadTrack(idx, autoplay){
  trackIdx = (idx + PLAYLIST.length) % PLAYLIST.length;
  el.title.textContent = PLAYLIST[trackIdx].title;
  el.bar.style.width = "0%";
  el.curT.textContent = "0:00";
  el.durT.textContent = "0:00";
  if (!ytPlayer || !isReady) return;
  if (autoplay) ytPlayer.loadVideoById(PLAYLIST[trackIdx].id);
  else ytPlayer.cueVideoById(PLAYLIST[trackIdx].id);
}
function startTick(){
  clearInterval(tick);
  tick = setInterval(() => {
    if (!ytPlayer || !isReady) return;
    const d = ytPlayer.getDuration(), c = ytPlayer.getCurrentTime();
    if (d > 0){
      el.bar.style.width = (c / d * 100) + "%";
      el.durT.textContent = fmt(d);
      el.curT.textContent = fmt(c);
    }
  }, 400);
}
function begin(){
  if (started) return;
  started = true;
  el.overlay.classList.add("hide");
  if (isReady && ytPlayer) ytPlayer.playVideo();
  startTick();
}

        else if (e.data === YT.PlayerState.PAUSED) setPlaying(false);
        else if (e.data === YT.PlayerState.ENDED) loadTrack(trackIdx + 1, true);
      }
    }
  });
};

      ["طيبتهم 🤍","الطيبين قليلين وهي منهم"],
      ["دعمهم 🙌","الدعم بيخفف أي حاجة"],
      ["وقفتهم معاكي 🌟","الوقفة وقت الضيق بتفضل"],
      ["كل حاجة 💖","تفتخري بيهم بجد"]]},
    { q:"أحلى وقت مع بعض بتبقى؟", o:[
      ["قعداتنا ☕","أبسطها وأحلاها"],
      ["ضحكنا 😹","الضحك بيتذكر دايمًا"],
      ["مشاويرنا 🚗","الطريق بيحلو بالصحبة"],
      ["كل لحظة ✨","كل لحظة بتستاهل"]]},
  ];
  let qi = 0;


  function renderQ(){
    const item = QUIZ[qi];
    paneQuiz.innerHTML =
      '<div class="qNum">سؤال ' + (qi+1) + ' من ' + QUIZ.length + '</div>' +
      '<div class="qText">' + item.q + '</div>' +
      '<div class="qOpts">' + item.o.map((o,i)=>'<button class="qOpt" data-i="'+i+'" type="button">'+o[0]+'</button>').join("") + '</div>' +
      '<div class="qReact" id="qReact"></div>';
    paneQuiz.querySelectorAll(".qOpt").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const react = paneQuiz.querySelector("#qReact");
        react.textContent = item.o[+btn.dataset.i][1];
        paneQuiz.querySelectorAll(".qOpt").forEach(b => b.disabled = true);
        setTimeout(() => { qi++; qi < QUIZ.length ? renderQ() : renderEnd(); }, 1150);
      });
    });
  }


  function renderEnd(){
    paneQuiz.innerHTML =
      '<div class="qEnd">' +
      '<span class="big">💖</span>' +
      '<h3>خلصتِ الأسئلة!</h3>' +
      '<p>كل إجاباتك حلوة… لأنك ببساطة صديقة من الآخر 🤍</p>' +
      '<button class="gbtn" id="qAgain" type="button">ابدئي من جديد 🔁</button>' +
      '</div>';
    paneQuiz.querySelector("#qAgain").addEventListener("click", e => { e.stopPropagation(); qi = 0; renderQ(); });
  }


  function showTab(name){
    tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    paneGame.classList.toggle("hidden", name !== "game");
    paneQuiz.classList.toggle("hidden", name !== "quiz");
    if (name === "quiz") renderQ();
  }


  function open(name){
    modal.classList.add("open");
    showTab(name);
    if (name === "game") {
      msgEl.style.display = "grid";
      if (!running) { gmTitle.textContent = "لعبة القلوب 💗"; gmText.textContent = "اضغطي على القلوب قبل ما تقع! عندك 30 ثانية 🎮"; gStart.textContent = "ابدئي"; }
    }
  }
  function close(){ stopGame(); modal.classList.remove("open"); }


  openGame.addEventListener("click", e => { e.stopPropagation(); open("game"); });
  openQuiz.addEventListener("click", e => { e.stopPropagation(); open("quiz"); });
  mclose.addEventListener("click", e => { e.stopPropagation(); close(); });
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  sheet.addEventListener("click", e => e.stopPropagation());
  tabs.forEach(t => t.addEventListener("click", e => {
    e.stopPropagation();
    if (t.dataset.tab === "game") stopGame();
    if (t.dataset.tab === "game" && msgEl) msgEl.style.display = "grid";
    showTab(t.dataset.tab);
  }));
  addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) close(); });
})();
</script>
</body>
</html>
